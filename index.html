.tag{border:2px solid var(--bad);color:var(--bad);padding:0 8px;transform:rotate(-3deg);font-weight:700;letter-spacing:2px}

button,a.btn{background:var(--fg);color:#000;border:0;padding:10px 14px;font:inherit;font-weight:700;display:inline-block;text-decoration:none;cursor:pointer}
.bar{height:8px;background:var(--line)}.bar i{display:block;height:100%;background:var(--fg);transition:width .6s}
.err{color:var(--bad);min-height:1.4em}.glitch{animation:g .4s}

.dim{color:var(--dim)}.r{background:var(--fg);color:var(--fg)}u{text-decoration:none;color:var(--dim)}
.card{border:1px dashed var(--dim);padding:10px;margin:8px 0}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:4px 8px;text-align:left}
#t p{margin:4px 0}.hide{display:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0}
#fx.bad{background:radial-gradient(transparent 35%,rgba(255,77,77,.5));animation:fl .6s}
#fx.good{background:radial-gradient(transparent 30%,rgba(125,255,155,.4));animation:fl 1s}
#fx.good::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--fg);box-shadow:0 0 22px var(--fg);animation:sw .9s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}@keyframes sw{from{top:0}to{top:100%}}
.shake{animation:sk .45s}@keyframes sk{0%,100%{transform:none}15%{transform:translateX(-9px);filter:hue-rotate(80deg)}35%{transform:translateX(9px)}55%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
.mod.new{animation:onl .9s}@keyframes onl{0%{box-shadow:0 0 0 var(--fg)}50%{box-shadow:0 0 26px var(--fg)}100%{box-shadow:none}}
#go:not(.hide) .btn{animation:pl 1.2s infinite}@keyframes pl{50%{box-shadow:0 0 22px var(--fg);transform:scale(1.03)}}
#fin:not(.hide){animation:onl 1.4s;border-color:var(--fg);font-size:17px}
.bar i{box-shadow:0 0 10px var(--fg)}
